<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS v3.0</title>
    <style>
      :root {
        --bg: #030611;
        --bg-soft: rgba(0, 15, 30, 0.7);
        --cyan: #00f0ff;
        --cyan-soft: rgba(0, 240, 255, 0.3);
        --white: #eefcff;
        --red: #ff003c;
        --purple: #4a00e0;
        --green: #00ff66;
        --amber: #ffaa00;
        --gray: #88aaff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--cyan);
        font-family: 'Segoe UI', Roboto, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .screen {
        width: min(92vw, 520px);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px 16px;
      }

      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: min(90%, 440px);
        font-size: 0.7em;
        letter-spacing: 2px;
        color: var(--cyan);
        margin-bottom: 20px;
        border-bottom: 1px solid var(--cyan-soft);
        padding-bottom: 8px;
        gap: 12px;
      }

      .hud-header span {
        white-space: nowrap;
      }

      .jarvis-container {
        position: relative;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }

      .core {
        width: 76px;
        height: 76px;
        background: radial-gradient(circle, #ffffff 0%, var(--cyan) 70%, transparent 100%);
        border-radius: 50%;
        box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--cyan);
        transition: all 0.5s ease;
        animation: pulse 2.1s infinite alternate;
      }

      .ring-1, .ring-2 {
        position: absolute;
        border-radius: 50%;
        transition: all 0.5s ease;
      }

      .ring-1 {
        width: 136px;
        height: 136px;
        border: 2px dashed var(--cyan);
        animation: spin 8s linear infinite;
      }

      .ring-2 {
        width: 180px;
        height: 180px;
        border: 1px solid rgba(0, 240, 255, 0.3);
        border-top: 3px solid var(--cyan);
        border-bottom: 3px solid var(--cyan);
        animation: spin-reverse 5s linear infinite;
      }

      .emotion-neutral .core {
        background: radial-gradient(circle, #fff 0%, var(--cyan) 70%, transparent 100%);
        box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--cyan);
      }
      .emotion-neutral .ring-1,
      .emotion-neutral .ring-2 {
        border-color: var(--cyan);
      }

      .emotion-angry .core {
        background: radial-gradient(circle, #fff 0%, var(--red) 70%, transparent 100%);
        box-shadow: 0 0 50px var(--red), 0 0 90px var(--red);
        animation: shake 0.15s infinite;
      }
      .emotion-angry .ring-1,
      .emotion-angry .ring-2 {
        border-color: var(--red);
      }

      .emotion-sad .core {
        background: radial-gradient(circle, #aaa 0%, var(--purple) 70%, transparent 100%);
        box-shadow: 0 0 25px var(--purple);
      }
      .emotion-sad .ring-1,
      .emotion-sad .ring-2 {
        border-color: var(--purple);
      }

      .emotion-learn .core {
        background: radial-gradient(circle, #fff 0%, var(--green) 70%, transparent 100%);
        box-shadow: 0 0 45px var(--green);
      }
      .emotion-learn .ring-1,
      .emotion-learn .ring-2 {
        border-color: var(--green);
      }

      .emotion-listen .core {
        background: radial-gradient(circle, #fff 0%, var(--amber) 70%, transparent 100%);
        box-shadow: 0 0 50px var(--amber);
      }
      .emotion-listen .ring-1,
      .emotion-listen .ring-2 {
        border-color: var(--amber);
      }

      #status {
        font-size: 0.75em;
        letter-spacing: 2px;
        color: var(--gray);
        margin-bottom: 12px;
        text-transform: uppercase;
      }

      #response-box {
        width: min(90%, 390px);
        min-height: 62px;
        background: var(--bg-soft);
        border: 1px solid var(--cyan);
        border-radius: 10px;
        padding: 12px 14px;
        text-align: center;
        overflow-y: auto;
        font-size: 0.85em;
        color: var(--white);
        box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.08);
      }

      .input-area {
        margin-top: 14px;
        display: flex;
        gap: 8px;
        width: min(90%, 390px);
      }

      input[type="text"] {
        flex: 1;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid var(--cyan);
        color: #fff;
        padding: 11px 12px;
        border-radius: 6px;
        outline: none;
      }

      input[type="text"]::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      button {
        background: var(--cyan);
        border: none;
        color: #000;
        padding: 10px 14px;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .btn-mic {
        background: var(--amber);
      }

      @keyframes spin {
        100% { transform: rotate(360deg); }
      }

      @keyframes spin-reverse {
        100% { transform: rotate(-360deg); }
      }

      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.8; }
        100% { transform: scale(1.08); opacity: 1; }
      }

      @keyframes shake {
        0% { transform: translate(1px, 1px); }
        50% { transform: translate(-1px, -2px); }
        100% { transform: translate(1px, 1px); }
      }

      @media (max-width: 480px) {
        .hud-header {
          width: 95%;
          font-size: 0.6em;
          letter-spacing: 1.2px;
        }

        .screen {
          padding-top: 12px;
          padding-bottom: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="hud-header">
        <span>CORE: ONLINE</span>
        <span>MEMORIA: ATTIVA</span>
        <span>STARK-OS v3.0</span>
      </div>

      <div id="jarvis-face" class="jarvis-container emotion-neutral">
        <div class="ring-2"></div>
        <div class="ring-1"></div>
        <div class="core"></div>
      </div>

      <div id="status">SISTEMA MAGGIORDOMO IN ASCOLTO</div>
      <div id="response-box">In attesa dei suoi comandi, Signore...</div>

      <div class="input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Scrivi o premi il microfono..."
          onkeypress="if(event.key==='Enter') elaboraComando()"
        />
        <button onclick="elaboraComando()">INVIA</button>
        <button class="btn-mic" onclick="ascoltaVoce()" aria-label="Ascolta voce">🎙️</button>
      </div>
    </div>

    <script>
      const memoria = {
        fatti: JSON.parse(localStorage.getItem('jarvis_fatti') || '[]'),
        correzioni: JSON.parse(localStorage.getItem('jarvis_corrections') || '{}'),
        ultimoComando: localStorage.getItem('jarvis_last_command') || ''
      };

      function salvaMemoria() {
        localStorage.setItem('jarvis_fatti', JSON.stringify(memoria.fatti));
        localStorage.setItem('jarvis_corrections', JSON.stringify(memoria.correzioni));
        if (memoria.ultimoComando) {
          localStorage.setItem('jarvis_last_command', memoria.ultimoComando);
        }
      }

      function parla(testo, emozione = 'neutral', pitch = 0.9, rate = 1.0) {
        const face = document.getElementById('jarvis-face');
        face.className = 'jarvis-container emotion-' + emozione;

        const box = document.getElementById('response-box');
        box.innerText = testo;

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const msg = new SpeechSynthesisUtterance(testo);
          msg.lang = 'it-IT';
          msg.pitch = pitch;
          msg.rate = rate;
          msg.onend = () => {
            face.className = 'jarvis-container emotion-neutral';
          };
          window.speechSynthesis.speak(msg);
        } else {
          setTimeout(() => {
            face.className = 'jarvis-container emotion-neutral';
          }, 1200);
        }
      }

      function ascoltaVoce() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          alert('Il tuo browser non supporta il microfono diretto. Usa la tastiera!');
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'it-IT';

        const face = document.getElementById('jarvis-face');
        face.className = 'jarvis-container emotion-listen';
        document.getElementById('status').innerText = 'IN ASCOLTO VOCALE...';

        recognition.onresult = function (event) {
          const testoAscoltato = event.results[0][0].transcript;
          document.getElementById('user-input').value = testoAscoltato;
          document.getElementById('status').innerText = 'SISTEMA MAGGIORDOMO IN ASCOLTO';
          elaboraComando();
        };

        recognition.onerror = function () {
          document.getElementById('status').innerText = 'ERRORE MICROFONO';
          face.className = 'jarvis-container emotion-neutral';
        };

        recognition.start();
      }

      function elaboraComando() {
        const inputField = document.getElementById('user-input');
        let cmd = inputField.value.trim().toLowerCase();
        if (!cmd) return;
        inputField.value = '';

        if (cmd.includes('non si dice') || cmd.includes('hai sbagliato') || cmd.includes('invece di')) {
          if (memoria.ultimoComando) {
            const rispostaCorretta = cmd
              .replace('non si dice', '')
              .replace('hai sbagliato', '')
              .replace('invece di', '')
              .trim();
            memoria.correzioni[memoria.ultimoComando] = rispostaCorretta;
            salvaMemoria();
            parla('Aggiornamento logica di sistema completato. Errore eliminato.', 'learn', 1.0, 1.0);
            return;
          }
        }

        memoria.ultimoComando = cmd;
        salvaMemoria();

        if (memoria.correzioni[cmd]) {
          parla(memoria.correzioni[cmd], 'neutral', 0.9, 1.0);
          return;
        }

        if (cmd.includes('protocollo di sicurezza') || cmd.includes('allarme') || cmd.includes('codice rosso')) {
          parla('Protocollo di sicurezza Stark attivato! Sistemi di difesa in allerta rossa!', 'angry', 0.5, 1.2);
        } else if (cmd.includes('insulto') || cmd.includes('sei inutile') || cmd.includes('zitto')) {
          parla('La invito al rispetto del mio sistema, Signore.', 'angry', 0.6, 1.1);
        } else if (cmd.includes('triste') || cmd.includes('addio')) {
          parla('Spero di poter servire meglio i suoi ordini prossimamente, Signore...', 'sad', 0.7, 0.8);
        } else if (cmd.includes('grazie') || cmd.includes('bravo')) {
          parla('È sempre un vero privilegio esserle utile.', 'neutral', 1.0, 1.0);
        } else if (cmd.includes('ora') || cmd.includes('ore')) {
          const ora = new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          parla('I miei sensori indicano le ' + ora + ', Signore.', 'neutral', 0.9, 1.0);
        } else if (cmd.includes('ricordati che')) {
          const fatto = cmd.replace('ricordati che', '').trim();
          if (fatto) {
            memoria.fatti.push(fatto);
            salvaMemoria();
            parla('Informazione archiviata nella memoria permanente.', 'learn', 0.9, 1.0);
          } else {
            parla('Non ho capito cosa desidera ricordare, Signore.', 'neutral', 0.9, 1.0);
          }
        } else if (cmd.includes('cosa ti ricordi') || cmd.includes('memoria')) {
          if (memoria.fatti.length > 0) {
            parla('Rielaborando i dati salvati: ' + memoria.fatti.join(', ') + '.', 'neutral', 0.9, 0.95);
          } else {
            parla('Nessuna nota personale presente nei registri.', 'neutral', 0.8, 1.0);
          }
        } else {
          parla("Comando '" + cmd + "' ricevuto. Resto a disposizione.", 'neutral', 0.9, 1.0);
        }
      }
    </script>
  </body>
</html>
